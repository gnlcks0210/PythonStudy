<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Title</title>
</head>
<body style = "background-color : skyblue;">
    <!-- h1: 글자를 표현하는 태그(요소) 가장 큰 글자 [h1,h2,h3...]-->
    <h1 style = "color : white">HelloWorld</h1>
    <!-- p태그도 문자를 표현하기 위한 태그(요소)-->
    <p style = "color : blue">이것은 내가 만든 첫 HTML 페이지 입니다.</p>
    <p>
        Python 크롤링 연습 중
    </p>

    <!-- 입력창을 만들기 -->
    <!-- type: ["text", "number", "date", "password"] input에 받을 값을 지정할 수 있다.-->
    <!-- placeholder : input에다가 희미한 글자로 표시를 할 수 있는 속성-->
    <input type = "text" placeholder="이름 입력"><br>
    <input type = "number"><br>
    <!-- button을 사용할 것이다. -->
    <button>전송</button>
    <!--hr : 구분선-->
    <hr>

    <!-- 리스트 -->
    <h3>좋아하는 음식</h3>
    <!-- li: 리스트-->
    <!-- ul: 리스트를 하나로 묶어주는 태그-->
    <ul>
        <li>치킨</li>
        <li>피자</li>
        <li>국밥</li>
    </ul>

</body>
</html>
